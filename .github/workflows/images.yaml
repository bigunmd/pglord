name: images
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths: ["deploy/Dockerfile*", ".github/workflows/images.yaml"]

env:
  REGISTRY: ghcr.io

jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
        timescaledb: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: suffix
        run: echo "s=${{ matrix.timescaledb == true && '-timescaledb' || '' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pglord-agent
          # latest=false is load-bearing. The default (latest=auto) adds a
          # `latest` tag on every semver build, and all six matrix variants
          # push to this one image name — so they race, and `latest` ends up
          # an arbitrary PostgreSQL major with arbitrary TimescaleDB. The tag
          # a cluster runs decides what its data can be read by, so the agent
          # deliberately has no floating tag at all.
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.pg }}${{ steps.suffix.outputs.s }},enable={{is_default_branch}}
            type=semver,pattern={{version}}-pg${{ matrix.pg }}${{ steps.suffix.outputs.s }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            TIMESCALEDB=${{ matrix.timescaledb }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/pglord-server
          # The server is a single build, so `latest` is unambiguous here and
          # tracking the newest release is what people expect of it.
          flavor: latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
