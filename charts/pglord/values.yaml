# Default values for pglord.
# pglord runs namespaced: it manages Postgres clusters in its own namespace and
# never needs cluster-wide permissions.

image:
  repository: pglord-server
  tag: "" # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# Image used for Postgres instances when a cluster does not name one.
# This must be reachable from the cluster: leaving the built-in default in place
# on a real cluster gives every new cluster ImagePullBackOff, since
# `pglord-agent:dev` only exists on a local development machine.
agentImage: pglord-agent:dev

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # The namespaced Role and RoleBinding pglord needs to manage clusters.
  # Turn off only if you manage these yourself; pglord cannot work without them.
  create: true

# pglord keeps no state of its own: cluster specs live in ConfigMaps in the
# namespace, so more than one replica is safe but buys nothing today. The
# reconciler and the backup scheduler would both run in every replica.
replicaCount: 1

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pglord.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

metrics:
  # Prometheus-operator resources. Both need the monitoring.coreos.com CRDs
  # installed; annotation-based scraping works without either.
  podMonitor:
    # Scrape every pglord-managed postgres pod on the agent port.
    enabled: false
  serviceMonitor:
    # Scrape the pglord server itself.
    enabled: false

auth:
  # API authentication. With neither mode configured the API runs OPEN and the
  # server logs a startup warning. Both modes may be enabled at once (static
  # token for CI + OIDC for humans).
  tokens:
    # Name of an existing Secret holding comma-separated bearer tokens.
    # Takes precedence over `value`. Two tokens make rotation zero-downtime:
    # add the new one, roll clients, remove the old one.
    existingSecret: ""
    secretKey: tokens
    # Dev convenience: renders a chart-managed Secret with this literal value.
    # Prefer existingSecret for anything real.
    value: ""
  oidc:
    # OIDC issuer URL (discovery is fetched from
    # <issuer>/.well-known/openid-configuration). Empty = OIDC off.
    issuer: ""
    # Public client ID the UI uses for the authorization-code + PKCE flow.
    # Required when issuer is set; the redirect URI to register at the IdP is
    # <ui-origin>/login/callback.
    clientId: ""
    # Expected `aud` claim; defaults to clientId when empty.
    audience: ""

config:
  # tracing-subscriber directive, e.g. "info" or "pglord_server=debug,info".
  logLevel: info
  # Exact origins allowed by CORS, comma-separated. Empty adds no CORS layer,
  # which is right when the UI is served by pglord itself.
  corsAllowedOrigins: ""
  # Graceful drain budget; keep below terminationGracePeriodSeconds.
  shutdownTimeoutSeconds: 25

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

# Applied to the pod. The server writes nothing to its own filesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
