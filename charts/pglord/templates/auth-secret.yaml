{{- /* Chart-managed token Secret, only for the dev-convenience literal value.
Anything real should use auth.tokens.existingSecret instead. */ -}}
{{- if and .Values.auth.tokens.value (not .Values.auth.tokens.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pglord.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pglord.labels" . | nindent 4 }}
type: Opaque
stringData:
  tokens: {{ .Values.auth.tokens.value | quote }}
{{- end }}
