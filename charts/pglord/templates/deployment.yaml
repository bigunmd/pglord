apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pglord.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pglord.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pglord.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pglord.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- $scrape := dict "prometheus.io/scrape" "true" "prometheus.io/port" "8080" "prometheus.io/path" "/metrics" }}
        {{- mergeOverwrite $scrape (.Values.podAnnotations | default dict) | toYaml | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pglord.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Below Kubernetes' 30s default, and above the server's drain budget, so
      # in-flight requests finish before the pod is killed.
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PGLORD_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PGLORD_CORS_ALLOWED_ORIGINS
              value: {{ .Values.config.corsAllowedOrigins | quote }}
            - name: PGLORD_SHUTDOWN_TIMEOUT_SECS
              value: {{ .Values.config.shutdownTimeoutSeconds | quote }}
            - name: PGLORD_DEFAULT_AGENT_IMAGE
              value: {{ .Values.agentImage | quote }}
            - name: PGLORD_SPEC_BACKEND
              value: {{ .Values.config.specBackend | quote }}
            - name: PGLORD_ALL_NAMESPACES
              value: {{ .Values.clusterWide | quote }}
            - name: PGLORD_AUTH_KUBERNETES
              value: {{ .Values.auth.kubernetes | quote }}
            {{- if or .Values.auth.tokens.existingSecret .Values.auth.tokens.value }}
            - name: PGLORD_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.auth.tokens.existingSecret }}
                  name: {{ .Values.auth.tokens.existingSecret }}
                  key: {{ .Values.auth.tokens.secretKey }}
                  {{- else }}
                  name: {{ include "pglord.fullname" . }}-auth
                  key: tokens
                  {{- end }}
            {{- end }}
            {{- if .Values.auth.oidc.issuer }}
            - name: PGLORD_AUTH_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: PGLORD_AUTH_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            {{- with .Values.auth.oidc.audience }}
            - name: PGLORD_AUTH_OIDC_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            - name: PGLORD_AUTH_OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            {{- if .Values.auth.oidc.rbac }}
            - name: PGLORD_AUTH_OIDC_RBAC
              value: "true"
            - name: PGLORD_AUTH_OIDC_USERNAME_CLAIM
              value: {{ .Values.auth.oidc.usernameClaim | quote }}
            - name: PGLORD_AUTH_OIDC_USERNAME_PREFIX
              value: {{ .Values.auth.oidc.usernamePrefix | quote }}
            - name: PGLORD_AUTH_OIDC_GROUPS_CLAIM
              value: {{ .Values.auth.oidc.groupsClaim | quote }}
            - name: PGLORD_AUTH_OIDC_GROUPS_PREFIX
              value: {{ .Values.auth.oidc.groupsPrefix | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
