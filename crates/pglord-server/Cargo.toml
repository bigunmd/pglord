[package]
name = "pglord-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8"
chrono = "0.4.45"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.33"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["client", "runtime"] }
mime_guess = { version = "2", optional = true }
pglord-core = { path = "../pglord-core" }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
rust-embed = { version = "8", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "yaml"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test"] }
http-body-util = "0.1.4"
tower = { version = "0.5", features = ["util"] }

[features]
embed-ui = ["dep:rust-embed", "dep:mime_guess"]
