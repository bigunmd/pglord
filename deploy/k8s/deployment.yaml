apiVersion: apps/v1
kind: Deployment
metadata:
  name: pglord-server
  namespace: pglord
spec:
  replicas: 1
  selector:
    matchLabels: { app: pglord-server }
  template:
    metadata:
      labels: { app: pglord-server }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: pglord-server
      containers:
        - name: server
          image: pglord-server:dev
          imagePullPolicy: Never # loaded via `minikube image load`
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: PGLORD_LOG_LEVEL, value: "info" }
            # Image for clusters created without one. Deliberately NOT the
            # built-in default (ghcr.io/bigunmd/pglord-agent:18) that the Helm
            # chart uses: these manifests are the minikube dev stand, and the
            # e2e suites exist to test the agent `make agent-image` just built,
            # not one pulled from a registry. Every image here is a local :dev
            # tag `minikube image load` puts in place.
            - { name: PGLORD_DEFAULT_AGENT_IMAGE, value: "pglord-agent:dev" }
            # Spec backend: "configmap" (standalone, default) or "crd"
            # (operator mode — install deploy/crds/ and uncomment the
            # pglord.dev rules in rbac.yaml first).
            - { name: PGLORD_SPEC_BACKEND, value: "configmap" }
            # Kubernetes-native auth: accept kubectl-created tokens, authorize
            # via RBAC on pglord.dev/postgresclusters. Needs the
            # auth-delegator binding from deploy/k8s/operator/rbac.yaml.
            # - { name: PGLORD_AUTH_KUBERNETES, value: "true" }
            # --- API authentication (off by default on the dev stand) ---
            # Static bearer tokens, comma-separated, from a Secret you manage:
            #   kubectl -n pglord create secret generic pglord-auth --from-literal=tokens=<token>
            # - name: PGLORD_AUTH_TOKENS
            #   valueFrom:
            #     secretKeyRef: { name: pglord-auth, key: tokens }
            # OIDC resource-server mode (register redirect URI <ui-origin>/login/callback):
            # - { name: PGLORD_AUTH_OIDC_ISSUER, value: "https://idp.example.com/realms/x" }
            # - { name: PGLORD_AUTH_OIDC_CLIENT_ID, value: "pglord" }
            # - { name: PGLORD_AUTH_OIDC_AUDIENCE, value: "pglord" } # defaults to client id
            # Authorize OIDC users through Kubernetes RBAC instead of giving
            # every valid token full admin. Claims below become the SAR
            # subject, so you bind ordinary Roles to oidc:<user> / oidc:<group>
            # — the apiserver does not need to know the IdP. Needs the same
            # auth-delegator binding from deploy/k8s/operator/rbac.yaml.
            # - { name: PGLORD_AUTH_OIDC_RBAC, value: "true" }
            # - { name: PGLORD_AUTH_OIDC_USERNAME_CLAIM, value: "email" }
            # - { name: PGLORD_AUTH_OIDC_USERNAME_PREFIX, value: "oidc:" }
            # - { name: PGLORD_AUTH_OIDC_GROUPS_CLAIM, value: "groups" }
            # - { name: PGLORD_AUTH_OIDC_GROUPS_PREFIX, value: "oidc:" }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
