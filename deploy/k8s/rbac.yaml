# Namespaced-only RBAC: pglord standalone mode never needs cluster-admin.
# The Role is sized for the coming reconciler (statefulsets/services/configmaps/
# secrets/pods), not just the current server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pglord-server
  namespace: pglord
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pglord-server
  namespace: pglord
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, pods, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Claims are created by the StatefulSet controller, but growing storage
  # patches them and scaling down deletes the orphans it leaves behind.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, patch, delete]
  # Deployments: the managed PgBouncer pooler (created, retuned and deleted
  # with the pooler block of the cluster spec).
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # The reconciler provisions a least-privilege Role/Binding per cluster so
  # instance agents can read their own spec ConfigMap (primary record).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pglord-server
  namespace: pglord
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pglord-server
subjects:
  - kind: ServiceAccount
    name: pglord-server
    namespace: pglord
