# Dev-only object storage for backup testing. NOT part of a pglord install:
# it uses fixed credentials and ephemeral storage. Real deployments point at
# their own S3-compatible endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: pglord
  labels: { app: minio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      # pgBackRest speaks TLS to S3 unconditionally, so even a dev MinIO needs
      # a certificate. Self-signed is fine; clusters set verify_tls: false.
      initContainers:
        - name: certs
          image: alpine/openssl:latest
          args:
            - req
            - -x509
            - -nodes
            - -newkey
            - rsa:2048
            - -keyout
            - /certs/private.key
            - -out
            - /certs/public.crt
            - -days
            - "365"
            - -subj
            - /CN=minio.pglord.svc.cluster.local
            - -addext
            - subjectAltName=DNS:minio.pglord.svc.cluster.local,DNS:minio
          volumeMounts:
            - { name: certs, mountPath: /certs }
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001", "--certs-dir", "/certs"]
          env:
            - { name: MINIO_ROOT_USER, value: pglordtest }
            - { name: MINIO_ROOT_PASSWORD, value: pglordtest123 }
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api, scheme: HTTPS }
            initialDelaySeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: certs, mountPath: /certs }
      volumes:
        - name: data
          emptyDir: {}
        - name: certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: pglord
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: api }
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  namespace: pglord
type: Opaque
stringData:
  access-key: pglordtest
  secret-key: pglordtest123
