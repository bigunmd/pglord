openapi: 3.1.0
info:
  title: pglord API
  description: Control plane for HA PostgreSQL clusters on Kubernetes.
  contact:
    name: Mikhail Bigun
    email: bigun.md@gmail.com
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  version: 0.1.0
paths:
  /api/v1/auth/config:
    get:
      tags:
      - system
      summary: |-
        Which login affordances the UI should render. When both modes are off the
        API runs unauthenticated and the UI skips login entirely.
      operationId: auth_config
      responses:
        '200':
          description: Available authentication modes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigResponse'
  /api/v1/clusters:
    get:
      tags:
      - clusters
      summary: List clusters.
      operationId: list_clusters
      responses:
        '200':
          description: Clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterSummary'
        '503':
          description: No Kubernetes environment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - clusters
      summary: Create a new Postgres cluster.
      operationId: create_cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterSpec'
        required: true
      responses:
        '201':
          description: Cluster spec stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSpec'
        '409':
          description: Cluster already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid spec
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: No Kubernetes environment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}:
    get:
      tags:
      - clusters
      summary: Get one cluster with per-instance topology.
      operationId: get_cluster
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cluster detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetail'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - clusters
      summary: Delete a cluster (children are garbage-collected via ownerReferences).
      operationId: delete_cluster
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
      - clusters
      summary: 'Change a running cluster: scale instances or grow storage.'
      operationId: patch_cluster
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecChange'
        required: true
      responses:
        '200':
          description: Updated cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetail'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Rejected change
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}/backups:
    get:
      tags:
      - backups
      summary: List the backups in a cluster's repository.
      operationId: list_backups
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Backups in the repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - backups
      summary: Take a full backup now, on the primary.
      operationId: create_backup
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupRequest'
      responses:
        '202':
          description: Backup started
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Backups are not configured
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}/restart:
    post:
      tags:
      - clusters
      summary: |-
        Restart every instance so staged settings take effect. Standbys go first
        and the primary last, keeping writes available for as long as possible.
      operationId: restart_cluster
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Rolling restart started
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}/restore:
    post:
      tags:
      - backups
      summary: Restore this cluster's backup into a new cluster.
      operationId: restore_cluster
      parameters:
      - name: name
        in: path
        description: Source cluster name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
        required: true
      responses:
        '201':
          description: Restored cluster created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSpec'
        '404':
          description: Source cluster not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Target exists, or the source has no repository
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}/rotate-credentials:
    post:
      tags:
      - clusters
      summary: |-
        Rotate the managed credentials: new generated passwords are written to the
        Secret, applied on the primary, then every instance is restarted.
      operationId: rotate_credentials
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Rotation started
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Cluster uses a user-supplied credentials Secret
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}/secrets:
    get:
      tags:
      - clusters
      summary: List the Secrets and ConfigMaps this cluster depends on.
      operationId: list_required_secrets
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Required Secrets and ConfigMaps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}/switchover:
    post:
      tags:
      - clusters
      summary: Promote a specific standby (planned switchover).
      operationId: switchover
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchoverRequest'
        required: true
      responses:
        '202':
          description: Switchover started
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Target cannot be promoted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Target is not part of this cluster
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/gucs:
    get:
      tags:
      - system
      summary: The settings pglord lets you tune, with the metadata a config editor needs.
      operationId: list_gucs
      responses:
        '200':
          description: Tunable settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GucInfo'
  /api/v1/ping:
    get:
      tags:
      - system
      summary: |-
        Unauthenticated liveness of the API surface (distinct from /healthz: this
        one is part of the versioned contract and appears in the OpenAPI spec).
      operationId: ping
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /api/v1/preflight:
    get:
      tags:
      - system
      summary: |-
        Report which cluster permissions pglord actually has, straight from the
        apiserver's own authorization decisions.
      operationId: get_preflight
      responses:
        '200':
          description: Permission report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightReport'
        '503':
          description: No Kubernetes environment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/version:
    get:
      tags:
      - system
      operationId: version
      responses:
        '200':
          description: Server version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
components:
  schemas:
    AntiAffinity:
      type: string
      enum:
      - preferred
      - required
      - disabled
    AuthConfigResponse:
      type: object
      required:
      - static_tokens_enabled
      properties:
        oidc:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OidcPublicConfig'
            description: Present when OIDC login is available; null otherwise.
        static_tokens_enabled:
          type: boolean
          description: True when the operator configured at least one static bearer token.
    BackupEntry:
      type: object
      required:
      - label
      - kind
      - started
      - finished
      - size_bytes
      properties:
        finished:
          type: integer
          format: int64
        kind:
          type: string
          description: '"full", "diff" or "incr".'
        label:
          type: string
          description: pgBackRest label, e.g. "20260731-120000F".
        size_bytes:
          type: integer
          format: int64
          description: Bytes this backup occupies in the repository.
        started:
          type: integer
          format: int64
          description: Unix seconds.
        wal_end:
          type:
          - string
          - 'null'
        wal_start:
          type:
          - string
          - 'null'
    BackupKind:
      type: string
      enum:
      - full
      - diff
      - incr
    BackupList:
      type: object
      required:
      - enabled
      - backups
      - runs
      properties:
        backups:
          type: array
          items:
            $ref: '#/components/schemas/BackupEntry'
          description: What is in the repository — this is what could be restored.
        enabled:
          type: boolean
        repository:
          type:
          - string
          - 'null'
          description: Where backups are stored, or null when backups are off.
        runs:
          type: array
          items:
            $ref: '#/components/schemas/BackupRun'
          description: What happened recently, including running and failed attempts.
        schedule:
          type:
          - string
          - 'null'
          description: Cron schedule, or null when backups are taken manually only.
    BackupRequest:
      type: object
      properties:
        kind:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BackupKind'
            description: '"full" (default), "diff" or "incr".'
    BackupRun:
      type: object
      required:
      - id
      - kind
      - trigger
      - state
      - started
      properties:
        error:
          type:
          - string
          - 'null'
        finished:
          type:
          - integer
          - 'null'
          format: int64
        id:
          type: string
        kind:
          type: string
          description: '"full", "diff" or "incr".'
        started:
          type: integer
          format: int64
          description: Unix seconds.
        state:
          $ref: '#/components/schemas/RunState'
        trigger:
          type: string
          description: '"manual" or "schedule".'
    BackupSpec:
      type: object
      properties:
        enabled:
          type: boolean
          description: Backups (and therefore WAL archiving) are off unless this is set.
        path_prefix:
          type:
          - string
          - 'null'
          description: Optional prefix inside the bucket, so several clusters can share one.
        retention_full:
          type: integer
          format: int32
          description: Full backups to keep. pgBackRest expires older ones automatically.
          minimum: 0
        s3_bucket:
          type:
          - string
          - 'null'
        s3_credentials_secret:
          type:
          - string
          - 'null'
          description: Secret holding `access-key` and `secret-key`. Values never live here.
        s3_endpoint:
          type:
          - string
          - 'null'
          description: S3-compatible endpoint, e.g. "https://s3.amazonaws.com" or a MinIO URL.
        s3_region:
          type: string
        schedule:
          type:
          - string
          - 'null'
          description: Cron expression (UTC) for automatic backups. None = manual only.
        schedule_kind:
          $ref: '#/components/schemas/BackupKind'
          description: Backup type the schedule takes.
        verify_tls:
          type: boolean
          description: |-
            Verify the endpoint's TLS certificate. Turn off only for storage with a
            self-signed certificate (a dev MinIO, typically).
    ClusterDetail:
      type: object
      required:
      - name
      - image
      - replicas
      - storage_size
      - ready_replicas
      - primary
      - parameters
      - pg_hba
      - workload
      - backup
      - env
      - init
      - tls
      - pending_restart
      - synchronous
      - sync_degraded
      - instances
      properties:
        backup:
          $ref: '#/components/schemas/BackupSpec'
          description: Backup repository (secret name only — never its contents).
        credentials_secret:
          type:
          - string
          - 'null'
          description: |-
            Secret the passwords come from when the user supplied their own; null
            when pglord generates them.
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVarSpec'
          description: |-
            Custom environment variables on the instances (secret *references*
            only — never their values).
        image:
          type: string
        init:
          $ref: '#/components/schemas/InitSpec'
          description: Sources of the one-time initialisation scripts.
        instances:
          type: array
          items:
            $ref: '#/components/schemas/InstanceDto'
        name:
          type: string
        parameters:
          type: object
          description: PostgreSQL settings applied on top of the defaults.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pending_restart:
          type: boolean
          description: Any instance is waiting on a restart to apply staged settings.
        pg_hba:
          type: array
          items:
            $ref: '#/components/schemas/HbaRule'
          description: Client access rules between pglord's managed prefix and catch-all.
        primary:
          type: string
          description: Recorded primary pod (the single writer per the primary record).
        ready_replicas:
          type: integer
          format: int32
        replicas:
          type: integer
          format: int32
          minimum: 0
        restore:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RestoreSpec'
            description: |-
              Where this cluster's data came from, when it was created by a restore.
              Null for clusters that started empty.
        storage_size:
          type: string
        sync_degraded:
          type: boolean
          description: |-
            Synchronous replication is on but the primary sees no connected sync
            standby: commits are blocking until one reconnects.
        synchronous:
          type: boolean
          description: Commits wait for any one standby to confirm the WAL flush.
        tls:
          $ref: '#/components/schemas/TlsSpec'
          description: |-
            TLS from a referenced kubernetes.io/tls Secret (name only — never its
            contents).
        workload:
          $ref: '#/components/schemas/WorkloadSpec'
          description: Scheduling, resources and Kubernetes metadata for the instances.
    ClusterSpec:
      type: object
      required:
      - name
      properties:
        backup:
          $ref: '#/components/schemas/BackupSpec'
          description: |-
            Backup repository. Disabled by default; enabling it also turns on WAL
            archiving, which needs a restart.
        credentials_secret:
          type:
          - string
          - 'null'
          description: |-
            Secret holding the superuser and replication passwords. When set,
            pglord uses it instead of generating one — so the cluster has a single
            source of truth for its credentials rather than two.
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVarSpec'
          description: |-
            Extra environment variables on the instance containers, for init
            scripts and anything else in the container to read.
        image:
          type: string
          description: Image containing postgres + pglord-agent (agent is the entrypoint).
        init:
          $ref: '#/components/schemas/InitSpec'
          description: SQL run once, when the data directory is first created.
        name:
          type: string
          description: RFC1123 label; used as the prefix of every derived object name.
        parameters:
          type: object
          description: |-
            PostgreSQL settings applied on top of the defaults. Only settings in the
            GUC catalog are accepted; pglord-managed settings are rejected.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pg_hba:
          type: array
          items:
            $ref: '#/components/schemas/HbaRule'
          description: |-
            Client access rules (pg_hba.conf) inserted between pglord's managed
            prefix and its scram catch-all. First match wins; use `reject` rules
            to tighten access. Applied with a reload — no restart.
        replicas:
          type: integer
          format: int32
          description: 'Total instances: 1 primary + (replicas - 1) streaming standbys.'
          minimum: 0
        restore:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RestoreSpec'
            description: |-
              Where this cluster's data came from, when it was created by restoring
              someone's backup. A one-shot bootstrap source: it is consumed the first
              time PGDATA is created and has no effect on a running cluster.
        storage_size:
          type: string
          description: PVC size per instance, e.g. "1Gi".
        synchronous:
          type: boolean
          description: |-
            Every commit waits until any one standby confirms the WAL flush
            (quorum `ANY 1` over all standbys). Strict: with no standby connected,
            writes block rather than silently falling back to async. Requires
            `replicas >= 2`. Applied with a reload — no restart.
        tls:
          $ref: '#/components/schemas/TlsSpec'
          description: |-
            TLS for client and replication connections, from a referenced
            kubernetes.io/tls Secret. Enabling or disabling rolls the instances
            (the cert mount changes the pod template).
        workload:
          $ref: '#/components/schemas/WorkloadSpec'
          description: Scheduling, resources and Kubernetes metadata for the instances.
    ClusterSummary:
      type: object
      required:
      - name
      - image
      - replicas
      - ready_replicas
      properties:
        image:
          type: string
        name:
          type: string
        ready_replicas:
          type: integer
          format: int32
          description: Instances currently passing their readiness probe.
        replicas:
          type: integer
          format: int32
          minimum: 0
    EnvVarSpec:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        secret:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SecretKeyRefSpec'
            description: Value taken from a Secret at pod start. Mutually exclusive with `value`.
        value:
          type:
          - string
          - 'null'
          description: Literal value. Mutually exclusive with `secret`.
    GucInfo:
      type: object
      required:
      - name
      - kind
      - apply
      - category
      - summary
      - default
      properties:
        apply:
          type: string
          description: '"reload" (applies live) or "restart".'
        category:
          type: string
        default:
          type: string
        kind:
          type: string
          description: 'Value shape: integer, real, bool, memory, duration, enum or stringlike.'
        name:
          type: string
        summary:
          type: string
    HbaConn:
      type: string
      enum:
      - host
      - hostssl
      - hostnossl
    HbaMethod:
      type: string
      description: |-
        Deliberately small: ldap/radius need auth options this schema does not
        carry, md5 is deprecated. Growing the list later is backwards-compatible;
        shrinking it is not. `cert` authenticates by client certificate (CN =
        role name, verify-full); it is only meaningful over TLS, so it is valid
        only on `hostssl` rules and only when the cluster has TLS enabled.
      enum:
      - scram-sha-256
      - reject
      - trust
      - cert
    HbaRule:
      type: object
      description: |-
        One user-supplied pg_hba rule. `local` is not expressible: the managed
        prefix owns socket access, and a user local rule after `local all all peer`
        could never match anyway.
      required:
      - conn
      - database
      - user
      - address
      - method
      properties:
        address:
          type: string
          description: CIDR ("10.0.0.0/8", "::1/128") or all | samehost | samenet.
        conn:
          $ref: '#/components/schemas/HbaConn'
        database:
          type: string
          description: '"all", "replication", or a single database name.'
        method:
          $ref: '#/components/schemas/HbaMethod'
        user:
          type: string
          description: '"all" or a single role name.'
    InitSpec:
      type: object
      properties:
        scripts_config_map:
          type:
          - string
          - 'null'
          description: ConfigMap whose `.sql` keys are run in filename order.
        scripts_secret:
          type:
          - string
          - 'null'
          description: |-
            Secret whose `.sql` keys are run after the ConfigMap's, in filename
            order. For init SQL that contains credentials.
    InstanceDto:
      type: object
      required:
      - pod
      - role
      - ready
      - pending_restart
      properties:
        lsn:
          type:
          - string
          - 'null'
          description: Current/receive WAL LSN as reported by the agent.
        pending_restart:
          type: boolean
          description: Settings are staged on this instance that only a restart will apply.
        pod:
          type: string
          description: Pod name, e.g. "demo-0".
        ready:
          type: boolean
        role:
          type: string
          description: '"primary" | "standby" | "unknown" (agent unreachable).'
        ssl:
          type:
          - boolean
          - 'null'
          description: This instance is accepting TLS connections. Null when unreachable.
        sync_standby_count:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Primary only: connected standbys eligible to confirm a synchronous
            commit. Null on standbys and unreachable instances.
          minimum: 0
    OidcPublicConfig:
      type: object
      required:
      - issuer
      - client_id
      properties:
        client_id:
          type: string
          description: Public client ID for the authorization-code + PKCE flow.
        issuer:
          type: string
          description: OIDC issuer URL the SPA runs discovery against.
    PingResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    PreflightCheck:
      type: object
      required:
      - resource
      - verb
      properties:
        allowed:
          type:
          - boolean
          - 'null'
          description: null when the check itself could not be performed.
        reason:
          type:
          - string
          - 'null'
        resource:
          type: string
          description: Resource name, group-qualified when not core (e.g. "statefulsets.apps").
        verb:
          type: string
    PreflightReport:
      type: object
      required:
      - namespace
      - ok
      - missing
      - checks
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PreflightCheck'
        missing:
          type: integer
          format: int32
          description: Permissions denied or unverifiable.
        namespace:
          type: string
        ok:
          type: boolean
          description: True only when every required permission is granted.
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        code:
          type: string
          description: Stable machine-readable code; clients must key on this, not `detail`.
        detail:
          type: string
          description: Human-readable explanation; not part of the stable contract.
        status:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
          description: Canonical reason phrase for the status.
        type:
          type: string
          description: 'URI reference identifying the problem type: `{PROBLEM_BASE_URL}/{code}`.'
    RequiredResource:
      type: object
      required:
      - name
      - kind
      - purpose
      - keys
      - managed
      properties:
        keys:
          type: array
          items:
            type: string
          description: Keys that must be present. Empty when any key will do (init scripts).
        kind:
          $ref: '#/components/schemas/ResourceKind'
        managed:
          type: boolean
          description: pglord creates and owns this one; the user creates the rest.
        name:
          type: string
        purpose:
          $ref: '#/components/schemas/ResourcePurpose'
    ResourceKind:
      type: string
      enum:
      - secret
      - configmap
    ResourceList:
      type: object
      required:
      - satisfied
      - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceStatus'
        satisfied:
          type: boolean
          description: Nothing the cluster depends on is missing or incomplete.
    ResourcePurpose:
      type: string
      description: |-
        Why a cluster needs this object. The UI translates these; keeping them
        machine-readable means the reason survives translation.
      enum:
      - credentials
      - backup_repository
      - restore_repository
      - custom_env
      - init_scripts
      - tls
    ResourceStatus:
      allOf:
      - $ref: '#/components/schemas/RequiredResource'
      - type: object
        required:
        - exists
        - missing_keys
        properties:
          exists:
            type: boolean
            description: The object exists in the namespace.
          missing_keys:
            type: array
            items:
              type: string
            description: |-
              Required keys the object does not have. Empty when it is absent
              entirely — that is what `exists` is for.
    Resources:
      type: object
      properties:
        cpu_limit:
          type:
          - string
          - 'null'
        cpu_request:
          type:
          - string
          - 'null'
        memory_limit:
          type:
          - string
          - 'null'
        memory_request:
          type:
          - string
          - 'null'
    RestoreRequest:
      type: object
      required:
      - target_cluster
      properties:
        backup_label:
          type:
          - string
          - 'null'
          description: Backup to restore, as listed in the repository. Omit for the latest.
        replicas:
          type:
          - integer
          - 'null'
          format: int32
          description: Instances in the new cluster. Defaults to the source's.
          minimum: 0
        target_cluster:
          type: string
          description: Name of the cluster to create. Must not already exist.
        target_time:
          type:
          - string
          - 'null'
          description: Recover to this instant (RFC3339, UTC) instead of the end of the WAL.
    RestoreSpec:
      type: object
      required:
      - source_cluster
      - repository
      properties:
        backup_label:
          type:
          - string
          - 'null'
          description: Which backup to restore. None restores the most recent one.
        repository:
          $ref: '#/components/schemas/BackupSpec'
          description: |-
            The repository to read, copied from the source when the restore was
            requested rather than referenced. The source can afterwards be
            reconfigured or deleted without stranding this cluster's bootstrap.
        source_cluster:
          type: string
          description: |-
            Cluster whose repository holds the backup. Names the pgBackRest stanza
            that is read — which is the *source's* stanza, not this cluster's.
        target_time:
          type:
          - string
          - 'null'
          description: Recover to this instant (RFC3339, UTC) instead of the end of the WAL.
    RunState:
      type: string
      enum:
      - running
      - succeeded
      - failed
      - unknown
    SecretKeyRefSpec:
      type: object
      required:
      - name
      - key
      properties:
        key:
          type: string
        name:
          type: string
          description: Secret in the same namespace. pglord never reads its contents.
    SpecChange:
      type: object
      description: |-
        The fields a running cluster may change. Name is deliberately absent:
        renaming would orphan every derived object.

        `credentials_secret` is absent for a subtler reason. Pointing a running
        cluster at a different Secret would change the password the agent presents
        without changing the one stored in `pg_authid`, so every client using the
        new Secret would be rejected while the cluster looked healthy. Rotating
        credentials is a real operation and needs its own workflow, not a field
        edit that silently half-applies.
      properties:
        backup:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BackupSpec'
            description: Full replacement of the backup block.
        env:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EnvVarSpec'
          description: |-
            Full replacement of the custom environment. Changing it rolls the
            instances, since the pod template changes.
        image:
          type:
          - string
          - 'null'
          description: |-
            Change the instance image. Rolls every instance, standbys first,
            primary last. Same-major images only — the agent refuses to start a
            data directory created by a different PostgreSQL major version.
        init:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InitSpec'
            description: |-
              Full replacement of the init block. Editing this does *not* re-run
              initialisation: scripts describe how a database is created, and the
              cluster's data directory already exists.
        parameters:
          type:
          - object
          - 'null'
          description: |-
            Full replacement of the parameter map: settings absent from it are
            removed, which is how the UI clears a setting back to its default.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pg_hba:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HbaRule'
          description: |-
            Full replacement of the pg_hba rule list: absent leaves it untouched,
            an empty list removes every user rule.
        replicas:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        storage_size:
          type:
          - string
          - 'null'
        synchronous:
          type:
          - boolean
          - 'null'
          description: 'Toggle synchronous replication. Reload-only: no restart, no roll.'
        tls:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TlsSpec'
            description: |-
              Full replacement of the TLS block. An empty block disables TLS.
              Either direction rolls the instances.
        workload:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkloadSpec'
            description: |-
              Full replacement of the workload block. StorageClass must match the
              current one (volume claim templates are immutable).
    SwitchoverRequest:
      type: object
      required:
      - target
      properties:
        target:
          type: string
          description: Pod to promote, e.g. "demo-1".
    TlsSpec:
      type: object
      properties:
        server_secret:
          type:
          - string
          - 'null'
          description: |-
            kubernetes.io/tls Secret holding the server certificate. TLS is
            enabled iff this is set; clearing it disables TLS. Both directions
            change the pod template and roll the instances.
    Toleration:
      type: object
      required:
      - key
      properties:
        effect:
          type:
          - string
          - 'null'
          description: '"NoSchedule", "PreferNoSchedule" or "NoExecute".'
        key:
          type: string
        operator:
          type:
          - string
          - 'null'
          description: '"Equal" (default) or "Exists".'
        value:
          type:
          - string
          - 'null'
    VersionResponse:
      type: object
      required:
      - version
      properties:
        version:
          type: string
    WorkloadSpec:
      type: object
      properties:
        annotations:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        anti_affinity:
          $ref: '#/components/schemas/AntiAffinity'
        image_pull_secrets:
          type: array
          items:
            type: string
        labels:
          type: object
          description: Extra labels on instance pods (cost allocation, scrape selection).
          additionalProperties:
            type: string
          propertyNames:
            type: string
        node_selector:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        priority_class_name:
          type:
          - string
          - 'null'
        resources:
          $ref: '#/components/schemas/Resources'
        storage_class:
          type:
          - string
          - 'null'
          description: StorageClass for instance volumes. Immutable after creation.
        tolerations:
          type: array
          items:
            $ref: '#/components/schemas/Toleration'
