openapi: 3.1.0
info:
  title: pglord API
  description: Control plane for HA PostgreSQL clusters on Kubernetes.
  contact:
    name: Mikhail Bigun
    email: bigun.md@gmail.com
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  version: 0.1.0
paths:
  /api/v1/clusters:
    get:
      tags:
      - clusters
      summary: List clusters.
      operationId: list_clusters
      responses:
        '200':
          description: Clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterSummary'
        '503':
          description: No Kubernetes environment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - clusters
      summary: Create a new Postgres cluster.
      operationId: create_cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterSpec'
        required: true
      responses:
        '201':
          description: Cluster spec stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSpec'
        '409':
          description: Cluster already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid spec
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: No Kubernetes environment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}:
    get:
      tags:
      - clusters
      summary: Get one cluster with per-instance topology.
      operationId: get_cluster
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cluster detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetail'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - clusters
      summary: Delete a cluster (children are garbage-collected via ownerReferences).
      operationId: delete_cluster
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
      - clusters
      summary: 'Change a running cluster: scale instances or grow storage.'
      operationId: patch_cluster
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecChange'
        required: true
      responses:
        '200':
          description: Updated cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetail'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Rejected change
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}/restart:
    post:
      tags:
      - clusters
      summary: |-
        Restart every instance so staged settings take effect. Standbys go first
        and the primary last, keeping writes available for as long as possible.
      operationId: restart_cluster
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Rolling restart started
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/clusters/{name}/switchover:
    post:
      tags:
      - clusters
      summary: Promote a specific standby (planned switchover).
      operationId: switchover
      parameters:
      - name: name
        in: path
        description: Cluster name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchoverRequest'
        required: true
      responses:
        '202':
          description: Switchover started
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Target cannot be promoted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Target is not part of this cluster
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/gucs:
    get:
      tags:
      - system
      summary: The settings pglord lets you tune, with the metadata a config editor needs.
      operationId: list_gucs
      responses:
        '200':
          description: Tunable settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GucInfo'
  /api/v1/ping:
    get:
      tags:
      - system
      summary: |-
        Unauthenticated liveness of the API surface (distinct from /healthz: this
        one is part of the versioned contract and appears in the OpenAPI spec).
      operationId: ping
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /api/v1/preflight:
    get:
      tags:
      - system
      summary: |-
        Report which cluster permissions pglord actually has, straight from the
        apiserver's own authorization decisions.
      operationId: get_preflight
      responses:
        '200':
          description: Permission report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightReport'
        '503':
          description: No Kubernetes environment
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/version:
    get:
      tags:
      - system
      operationId: version
      responses:
        '200':
          description: Server version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
components:
  schemas:
    ClusterDetail:
      type: object
      required:
      - name
      - image
      - replicas
      - storage_size
      - ready_replicas
      - primary
      - parameters
      - pending_restart
      - instances
      properties:
        image:
          type: string
        instances:
          type: array
          items:
            $ref: '#/components/schemas/InstanceDto'
        name:
          type: string
        parameters:
          type: object
          description: PostgreSQL settings applied on top of the defaults.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pending_restart:
          type: boolean
          description: Any instance is waiting on a restart to apply staged settings.
        primary:
          type: string
          description: Recorded primary pod (the single writer per the primary record).
        ready_replicas:
          type: integer
          format: int32
        replicas:
          type: integer
          format: int32
          minimum: 0
        storage_size:
          type: string
    ClusterSpec:
      type: object
      required:
      - name
      properties:
        image:
          type: string
          description: Image containing postgres + pglord-agent (agent is the entrypoint).
        name:
          type: string
          description: RFC1123 label; used as the prefix of every derived object name.
        parameters:
          type: object
          description: |-
            PostgreSQL settings applied on top of the defaults. Only settings in the
            GUC catalog are accepted; pglord-managed settings are rejected.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        replicas:
          type: integer
          format: int32
          description: 'Total instances: 1 primary + (replicas - 1) streaming standbys.'
          minimum: 0
        storage_size:
          type: string
          description: PVC size per instance, e.g. "1Gi".
    ClusterSummary:
      type: object
      required:
      - name
      - image
      - replicas
      - ready_replicas
      properties:
        image:
          type: string
        name:
          type: string
        ready_replicas:
          type: integer
          format: int32
          description: Instances currently passing their readiness probe.
        replicas:
          type: integer
          format: int32
          minimum: 0
    GucInfo:
      type: object
      required:
      - name
      - kind
      - apply
      - category
      - summary
      - default
      properties:
        apply:
          type: string
          description: '"reload" (applies live) or "restart".'
        category:
          type: string
        default:
          type: string
        kind:
          type: string
          description: 'Value shape: integer, real, bool, memory, duration, enum or stringlike.'
        name:
          type: string
        summary:
          type: string
    InstanceDto:
      type: object
      required:
      - pod
      - role
      - ready
      - pending_restart
      properties:
        lsn:
          type:
          - string
          - 'null'
          description: Current/receive WAL LSN as reported by the agent.
        pending_restart:
          type: boolean
          description: Settings are staged on this instance that only a restart will apply.
        pod:
          type: string
          description: Pod name, e.g. "demo-0".
        ready:
          type: boolean
        role:
          type: string
          description: '"primary" | "standby" | "unknown" (agent unreachable).'
    PingResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    PreflightCheck:
      type: object
      required:
      - resource
      - verb
      properties:
        allowed:
          type:
          - boolean
          - 'null'
          description: null when the check itself could not be performed.
        reason:
          type:
          - string
          - 'null'
        resource:
          type: string
          description: Resource name, group-qualified when not core (e.g. "statefulsets.apps").
        verb:
          type: string
    PreflightReport:
      type: object
      required:
      - namespace
      - ok
      - missing
      - checks
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PreflightCheck'
        missing:
          type: integer
          format: int32
          description: Permissions denied or unverifiable.
        namespace:
          type: string
        ok:
          type: boolean
          description: True only when every required permission is granted.
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        code:
          type: string
          description: Stable machine-readable code; clients must key on this, not `detail`.
        detail:
          type: string
          description: Human-readable explanation; not part of the stable contract.
        status:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
          description: Canonical reason phrase for the status.
        type:
          type: string
          description: 'URI reference identifying the problem type: `{PROBLEM_BASE_URL}/{code}`.'
    SpecChange:
      type: object
      description: |-
        The fields a running cluster may change. Name and image are deliberately
        absent: renaming would orphan every derived object, and image changes are a
        rolling-upgrade concern with its own (future) workflow.
      properties:
        parameters:
          type:
          - object
          - 'null'
          description: |-
            Full replacement of the parameter map: settings absent from it are
            removed, which is how the UI clears a setting back to its default.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        replicas:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        storage_size:
          type:
          - string
          - 'null'
    SwitchoverRequest:
      type: object
      required:
      - target
      properties:
        target:
          type: string
          description: Pod to promote, e.g. "demo-1".
    VersionResponse:
      type: object
      required:
      - version
      properties:
        version:
          type: string
